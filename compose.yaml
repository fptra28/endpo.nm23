services:
  db:
    image: postgres:17-alpine
    container_name: endpo-nm23-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-endpo_nm23}
      POSTGRES_USER: ${POSTGRES_USER:-endpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-endpo_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/cache_store.sql:/docker-entrypoint-initdb.d/001-cache-store.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-endpo} -d ${POSTGRES_DB:-endpo_nm23}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: endpo-nm23-api:latest
    container_name: endpo-nm23-api
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-endpo}:${POSTGRES_PASSWORD:-endpo_local_password}@db:5432/${POSTGRES_DB:-endpo_nm23}?sslmode=disable"
      POSTGRES_URL: "postgresql://${POSTGRES_USER:-endpo}:${POSTGRES_PASSWORD:-endpo_local_password}@db:5432/${POSTGRES_DB:-endpo_nm23}?sslmode=disable"
      ICDX_AI_POLL_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: endpo-nm23-api:latest
    container_name: endpo-nm23-scraper
    init: true
    restart: unless-stopped
    command:
      - node
      - services/icdxWorker.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-endpo}:${POSTGRES_PASSWORD:-endpo_local_password}@db:5432/${POSTGRES_DB:-endpo_nm23}?sslmode=disable"
      POSTGRES_URL: "postgresql://${POSTGRES_USER:-endpo}:${POSTGRES_PASSWORD:-endpo_local_password}@db:5432/${POSTGRES_DB:-endpo_nm23}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "kill -0 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  adminer:
    image: adminer:6.0.1-standalone
    container_name: endpo-nm23-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r \"exit(@file_get_contents('http://127.0.0.1:8080') === false ? 1 : 0);\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
